<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>스마트 약 복용 관리</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
  <style>
    body { font-family: 'Pretendard', sans-serif; background-color: #f3f4f6; }
    .toggle-checkbox:checked { right: 0; border-color: #3b82f6; }
    .toggle-checkbox:checked + .toggle-label { background-color: #3b82f6; }
    .toggle-checkbox { right: 0; z-index: 1; border-color: #e5e7eb; transition: all 0.3s; }
    .toggle-label { background-color: #e5e7eb; transition: all 0.3s; }
  </style>
</head>
<body class="antialiased min-h-screen flex justify-center pb-24">

  <div class="w-full max-w-md p-5 bg-white shadow-xl min-h-screen flex flex-col justify-between">
    <div>
      <header class="mb-6 pt-2 flex justify-between items-center">
        <div>
          <h1 class="text-2xl font-bold text-gray-800">💊 스마트 약 복용</h1>
          <p id="today-date" class="text-gray-500 text-sm mt-1 font-medium"></p>
        </div>
        <button type="button" onclick="requestNotificationPermission()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 text-xs px-3 py-2 rounded-lg font-semibold transition">
          🔔 알림 켜기
        </button>
      </header>

      <section class="bg-gradient-to-br from-blue-50 to-indigo-50 p-4 rounded-2xl mb-6 shadow-sm border border-blue-100">
        <div class="flex justify-between items-center mb-3">
          <h2 class="text-sm font-bold text-blue-900">이번 달 복용 현황</h2>
          <span class="text-xs text-blue-600 bg-white px-2 py-1 rounded-full shadow-xs">🟢완료 🔴미완료</span>
        </div>
        <div id="calendar-grid" class="grid grid-cols-7 gap-1 text-center text-xs"></div>
      </section>

      <form id="med-form" class="space-y-4">
        <!-- 아침 -->
        <section class="bg-blue-50/60 p-4 rounded-2xl border border-blue-100">
          <h3 class="text-sm font-bold text-blue-800 mb-3">☀️ 아침 (기상 후)</h3>
          <div class="flex justify-between items-center mb-2.5">
            <span class="text-gray-700 text-sm font-medium">혈압약</span>
            <div class="relative inline-block w-10 mr-1 select-none">
              <input type="checkbox" id="morning_bp" onchange="autoSaveLocal()" class="toggle-checkbox absolute block w-5 h-5 rounded-full bg-white border-4 appearance-none cursor-pointer"/>
              <label for="morning_bp" class="toggle-label block overflow-hidden h-5 rounded-full bg-gray-300 cursor-pointer"></label>
            </div>
          </div>
          <div class="flex justify-between items-center">
            <span class="text-gray-700 text-sm font-medium">과민성대장약</span>
            <div class="relative inline-block w-10 mr-1 select-none">
              <input type="checkbox" id="morning_ibs" onchange="autoSaveLocal()" class="toggle-checkbox absolute block w-5 h-5 rounded-full bg-white border-4 appearance-none cursor-pointer"/>
              <label for="morning_ibs" class="toggle-label block overflow-hidden h-5 rounded-full bg-gray-300 cursor-pointer"></label>
            </div>
          </div>
        </section>

        <!-- 점심 -->
        <section class="bg-emerald-50/60 p-4 rounded-2xl border border-emerald-100">
          <h3 class="text-sm font-bold text-emerald-800 mb-3">🍽️ 점심 (식후)</h3>
          <div class="flex justify-between items-center">
            <span class="text-gray-700 text-sm font-medium">영양제 (합쎈, 오메가3 등)</span>
            <div class="relative inline-block w-10 mr-1 select-none">
              <input type="checkbox" id="lunch_supp" onchange="autoSaveLocal()" class="toggle-checkbox absolute block w-5 h-5 rounded-full bg-white border-4 appearance-none cursor-pointer"/>
              <label for="lunch_supp" class="toggle-label block overflow-hidden h-5 rounded-full bg-gray-300 cursor-pointer"></label>
            </div>
          </div>
        </section>

        <!-- 저녁 -->
        <section class="bg-indigo-50/60 p-4 rounded-2xl border border-indigo-100">
          <h3 class="text-sm font-bold text-indigo-800 mb-3">🌙 저녁 (식후)</h3>
          <div class="flex justify-between items-center mb-2.5">
            <span class="text-gray-700 text-sm font-medium">과민성대장약</span>
            <div class="relative inline-block w-10 mr-1 select-none">
              <input type="checkbox" id="evening_ibs" onchange="autoSaveLocal()" class="toggle-checkbox absolute block w-5 h-5 rounded-full bg-white border-4 appearance-none cursor-pointer"/>
              <label for="evening_ibs" class="toggle-label block overflow-hidden h-5 rounded-full bg-gray-300 cursor-pointer"></label>
            </div>
          </div>
          <div class="flex justify-between items-center">
            <span class="text-gray-700 text-sm font-medium">탈모약</span>
            <div class="relative inline-block w-10 mr-1 select-none">
              <input type="checkbox" id="evening_hair" onchange="autoSaveLocal()" class="toggle-checkbox absolute block w-5 h-5 rounded-full bg-white border-4 appearance-none cursor-pointer"/>
              <label for="evening_hair" class="toggle-label block overflow-hidden h-5 rounded-full bg-gray-300 cursor-pointer"></label>
            </div>
          </div>
        </section>
      </form>
    </div>

    <div class="fixed bottom-0 left-0 right-0 p-4 bg-white/90 backdrop-blur-md border-t border-gray-200 flex justify-center max-w-md mx-auto">
      <button type="button" id="submit-btn" onclick="saveRecord()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl shadow-lg transition text-base">
        오늘 복용 완료 기록하기 ✨
      </button>
    </div>
  </div>

  <script>
    // ⚙️ 여기에 구글 웹 앱 URL을 넣으세요!
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzanOHTz9ULcdljLMxuY3Y9SF4V2OpjIq-8ybkrm1sEFbO1nuqsWnCcnTsBTym0fYsG/exec';

    const today = new Date();
    const year = today.getFullYear();
    const month = today.getMonth();
    const dateStrFormatted = `${year}-${String(month + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;

    const days = ['일','월','화','수','목','금','토'];
    document.getElementById('today-date').innerText = `${year}년 ${month + 1}월 ${today.getDate()}일 (${days[today.getDay()]})`;

    const medIds = ['morning_bp', 'morning_ibs', 'lunch_supp', 'evening_ibs', 'evening_hair'];

    // 날짜 텍스트 정규화 (YYYY-MM-DD)
    function normalizeDate(dStr) {
      if (!dStr) return '';
      let str = String(dStr).trim();
      // '2026. 9. 18.' 또는 '2026/09/18' 등을 '2026-09-18' 형태로 변환
      let parts = str.split(/[\.\-\/]/).map(p => p.trim()).filter(p => p.length > 0);
      if (parts.length >= 3) {
        let y = parts[0];
        let m = parts[1].padStart(2, '0');
        let d = parts[2].padStart(2, '0');
        return `${y}-${m}-${d}`;
      }
      return str;
    }

    // 1. 페이지 열리자마자 기기 저장소(localStorage)에서 즉시 체크 상태 복원!
    window.addEventListener('DOMContentLoaded', () => {
      loadLocalState();
      loadHistoryAndRenderCalendar();
    });

    // 로컬 스토리지에 즉시 저장 (스위치 누르는 순간 보존)
    function autoSaveLocal() {
      const state = {};
      medIds.forEach(id => {
        state[id] = document.getElementById(id).checked;
      });
      localStorage.setItem(`med_state_${dateStrFormatted}`, JSON.stringify(state));
    }

    // 로컬 스토리지에서 상태 불러오기
    function loadLocalState() {
      const saved = localStorage.getItem(`med_state_${dateStrFormatted}`);
      if (saved) {
        const state = JSON.parse(saved);
        medIds.forEach(id => {
          if (state[id] !== undefined) {
            document.getElementById(id).checked = state[id];
          }
        });
      }
    }

    // 구글 시트 데이터 불러오기 및 달력 렌더링
    async function loadHistoryAndRenderCalendar() {
      const grid = document.getElementById('calendar-grid');
      grid.innerHTML = '<div class="col-span-7 text-center py-4 text-gray-400">데이터 동기화 중... ⏳</div>';

      let historyMap = {};
      try {
        const response = await fetch(SCRIPT_URL);
        const data = await response.json();
        
        if (Array.isArray(data)) {
          data.forEach(row => {
            if (row.date) {
              const cleanDate = normalizeDate(row.date);
              const isAllCompleted = (row.morning_bp === '복용' && row.morning_ibs === '복용' && row.lunch_supp === '복용' && row.evening_ibs === '복용' && row.evening_hair === '복용');
              historyMap[cleanDate] = isAllCompleted;

              // 구글 시트에 오늘 데이터가 있으면 스위치 상태를 동기화
              if (cleanDate === dateStrFormatted) {
                document.getElementById('morning_bp').checked = (row.morning_bp === '복용');
                document.getElementById('morning_ibs').checked = (row.morning_ibs === '복용');
                document.getElementById('lunch_supp').checked = (row.lunch_supp === '복용');
                document.getElementById('evening_ibs').checked = (row.evening_ibs === '복용');
                document.getElementById('evening_hair').checked = (row.evening_hair === '복용');
                autoSaveLocal(); // 로컬도 업데이트
              }
            }
          });
        }
      } catch (e) {
        console.error('데이터 로드 실패:', e);
      }

      grid.innerHTML = '';
      days.forEach(d => {
        grid.innerHTML += `<div class="font-bold text-gray-500 py-1">${d}</div>`;
      });

      const firstDayIndex = new Date(year, month, 1).getDay();
      const totalDays = new Date(year, month + 1, 0).getDate();

      for (let i = 0; i < firstDayIndex; i++) {
        grid.innerHTML += `<div></div>`;
      }

      for (let day = 1; day <= totalDays; day++) {
        const dStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        let statusBadge = '<div class="text-xs text-gray-300">·</div>';
        
        if (historyMap[dStr] === true) {
          statusBadge = '<div class="text-xs text-green-600 font-bold">🟢</div>';
        } else if (historyMap[dStr] === false || (dStr < dateStrFormatted && historyMap[dStr] === undefined)) {
          statusBadge = '<div class="text-xs text-red-400">🔴</div>';
        }

        const isToday = (dStr === dateStrFormatted) ? 'border border-blue-500 font-bold bg-blue-50' : '';
        
        grid.innerHTML += `
          <div class="p-1 rounded-lg flex flex-col items-center justify-center ${isToday}">
            <span class="text-gray-700">${day}</span>
            ${statusBadge}
          </div>
        `;
      }
    }

    // 기록 저장
    async function saveRecord() {
      autoSaveLocal(); // 저장 누르는 순간 로컬에 즉시 영구보존

      const btn = document.getElementById('submit-btn');
      btn.innerText = '스프레드시트에 저장 중... ⏳';
      btn.disabled = true;

      const data = {
        date: dateStrFormatted,
        morning_bp: document.getElementById('morning_bp').checked ? '복용' : '미복용',
        morning_ibs: document.getElementById('morning_ibs').checked ? '복용' : '미복용',
        lunch_supp: document.getElementById('lunch_supp').checked ? '복용' : '미복용',
        evening_ibs: document.getElementById('evening_ibs').checked ? '복용' : '미복용',
        evening_hair: document.getElementById('evening_hair').checked ? '복용' : '미복용'
      };

      try {
        await fetch(SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        alert('오늘의 복용 기록이 성공적으로 저장 및 동기화되었습니다! 🎉');
        loadHistoryAndRenderCalendar();
      } catch (error) {
        alert('구글 시트 저장에 실패했습니다. (기기 내에는 저장됨)');
      } finally {
        btn.innerText = '오늘 복용 완료 기록하기 ✨';
        btn.disabled = false;
      }
    }

    function requestNotificationPermission() {
      if (!("Notification" in window)) {
        alert("이 기기/브라우저는 알림을 지원하지 않습니다.");
        return;
      }
      Notification.requestPermission().then(permission => {
        if (permission === "granted") {
          alert("알림이 설정되었습니다!");
        } else {
          alert("알림 권한이 거부되었습니다.");
        }
      });
    }
  </script>
</body>
</html>
